<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14141c" />
      <stop offset="100%" stop-color="#08080c" />
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8bac0f" />
      <stop offset="100%" stop-color="#306230" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- App Icon Background (Rounded Rect with Safe Margin) -->
  <rect width="512" height="512" rx="108" fill="url(#bg)" />

  <!-- Outer Border -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="#2a2a38" stroke-width="8" />

  <!-- Game Boy Green Screen Display Area -->
  <rect x="72" y="72" width="368" height="240" rx="24" fill="url(#screen)" stroke="#0f380f" stroke-width="8" />

  <!-- LCD Screen Grid lines (Subtle) -->
  <line x1="72" y1="132" x2="440" y2="132" stroke="#0f380f" stroke-width="2" opacity="0.3" />
  <line x1="72" y1="192" x2="440" y2="192" stroke="#0f380f" stroke-width="2" opacity="0.3" />
  <line x1="72" y1="252" x2="440" y2="252" stroke="#0f380f" stroke-width="2" opacity="0.3" />

  <!-- Waveform Graphic on LCD Screen -->
  <path d="M 88 192 L 140 192 L 140 112 L 200 112 L 200 272 L 260 272 L 260 152 L 320 152 L 320 232 L 370 232 L 370 192 L 424 192" 
        fill="none" stroke="#0f380f" stroke-width="12" stroke-linecap="round" stroke-linejoin="miter" />

  <!-- Tracker Text / Logo: hT -->
  <rect x="88" y="88" width="60" height="32" rx="6" fill="#0f380f" />
  <text x="118" y="112" fill="#9bbc0f" font-family="monospace, monospace" font-size="22" font-weight="900" text-anchor="middle">hT</text>

  <!-- Notes & Pulse bars below screen -->
  <!-- Piano Keys below screen -->
  <g transform="translate(72, 340)">
    <!-- White Keys -->
    <rect x="0" y="0" width="46" height="100" rx="6" fill="#f4f4f5" stroke="#18181b" stroke-width="4" />
    <rect x="46" y="0" width="46" height="100" rx="6" fill="#f4f4f5" stroke="#18181b" stroke-width="4" />
    <rect x="92" y="0" width="46" height="100" rx="6" fill="#f4f4f5" stroke="#18181b" stroke-width="4" />
    <rect x="138" y="0" width="46" height="100" rx="6" fill="#f4f4f5" stroke="#18181b" stroke-width="4" />
    <rect x="184" y="0" width="46" height="100" rx="6" fill="#f4f4f5" stroke="#18181b" stroke-width="4" />
    <rect x="230" y="0" width="46" height="100" rx="6" fill="#f4f4f5" stroke="#18181b" stroke-width="4" />
    <rect x="276" y="0" width="46" height="100" rx="6" fill="#f4f4f5" stroke="#18181b" stroke-width="4" />
    <rect x="322" y="0" width="46" height="100" rx="6" fill="#f4f4f5" stroke="#18181b" stroke-width="4" />

    <!-- Black Keys -->
    <rect x="32" y="0" width="28" height="60" rx="4" fill="#18181b" />
    <rect x="78" y="0" width="28" height="60" rx="4" fill="#18181b" />
    <rect x="170" y="0" width="28" height="60" rx="4" fill="#18181b" />
    <rect x="216" y="0" width="28" height="60" rx="4" fill="#18181b" />
    <rect x="262" y="0" width="28" height="60" rx="4" fill="#18181b" />
    
    <!-- Active Key Glow -->
    <rect x="92" y="0" width="46" height="100" rx="6" fill="url(#accent)" stroke="#b45309" stroke-width="4" opacity="0.85" />
  </g>
</svg>
